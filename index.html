<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HTC Driver">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>HTC 2026 · Team Last Milers</title>
<style>
:root{
  --bg:#0b1220; --bg2:#131c2e; --card:#182338; --card2:#1f2c45;
  --line:#2a3856; --text:#eaf0fb; --muted:#93a2c0; --muted2:#6b7a99;
  --accent:#4da3ff; --accent2:#2b6fd6;
  --e:#37c98a; --m:#4da3ff; --h:#ff9f43; --vh:#ff5d5d;
  --safe:#37c98a; --warn:#ffcf5c; --danger:#ff5d5d;
  --radius:16px; --tabh:64px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{padding-bottom:calc(var(--tabh) + var(--safe-bot))}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
.hidden{display:none!important}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(var(--safe-top) + 10px) 16px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-title{font-size:19px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.h-title .badge{background:linear-gradient(135deg,#ff7a45,#ff5d5d);color:#fff;font-size:11px;
  font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.5px}
.h-sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* Views */
main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  margin:22px 4px 10px;font-weight:700}
h2.sec:first-child{margin-top:4px}

/* Cards */
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);
  padding:15px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px;font-weight:700}
.card p{margin:7px 0;font-size:14.5px;line-height:1.5;color:#dce4f4}
.card ul{margin:7px 0;padding-left:20px}
.card li{font-size:14.5px;line-height:1.55;margin:5px 0;color:#dce4f4}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* Search + filter */
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar input{flex:1;background:var(--card);border:1px solid rgba(255,255,255,.09);
  color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.searchbar input::placeholder{color:var(--muted2)}
.segbar{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px;
  gap:4px;border:1px solid rgba(255,255,255,.06)}
.segbar button{flex:1;background:transparent;border:0;color:var(--muted);font-size:13.5px;
  font-weight:700;padding:9px 6px;border-radius:9px;transition:.15s}
.segbar button.active{background:var(--accent2);color:#fff}

/* Leg list */
.leg-item{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:13px 14px;margin-bottom:9px;
  cursor:pointer;transition:.12s}
.leg-item:active{transform:scale(.985);background:var(--card2)}
.leg-num{min-width:42px;height:42px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:17px;background:var(--bg2);position:relative}
.leg-num .van{position:absolute;bottom:-6px;right:-4px;font-size:8.5px;font-weight:800;
  background:var(--accent2);color:#fff;padding:1px 4px;border-radius:5px}
.leg-num .van.v2{background:#8b5cf6}
.leg-body{flex:1;min-width:0}
.leg-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.leg-meta{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.4px;
  text-transform:uppercase;color:#0b1220}
.pill.E{background:var(--e)} .pill.M{background:var(--m)} .pill.H{background:var(--h)} .pill.VH{background:var(--vh);color:#fff}
.chev{color:var(--muted2);font-size:20px}
.leg-item.leg-now{border-color:rgba(77,163,255,.55);background:rgba(77,163,255,.1)}
.now-tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;background:var(--accent);color:#06131f;padding:2px 6px;border-radius:5px}

/* Detail */
.detail-head{background:linear-gradient(135deg,var(--card2),var(--card));border-radius:var(--radius);
  padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.07)}
.detail-head .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.detail-head h2{margin:0;font-size:22px;font-weight:800}
.detail-head .ded{font-size:13px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stat{flex:1;min-width:78px;background:rgba(255,255,255,.05);border-radius:11px;padding:9px 10px;text-align:center}
.stat .v{font-size:16px;font-weight:800}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.gps-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;
  padding:14px;border-radius:13px;font-size:15px;font-weight:800;margin-bottom:12px;cursor:pointer}
.gps-btn:active{opacity:.85}
.addr{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.note-box{background:rgba(255,207,92,.1);border:1px solid rgba(255,207,92,.3);border-radius:12px;
  padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.5;color:#ffe9b8}
.note-box b{color:var(--warn)}
.note-box.danger{background:rgba(255,93,93,.1);border-color:rgba(255,93,93,.35);color:#ffc9c9}
.note-box.danger b{color:var(--danger)}

/* directions */
.dir{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.dir:last-child{border-bottom:0}
.dir .mi{min-width:46px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;color:var(--accent);text-align:right}
.dir .ar{min-width:20px;text-align:center;font-size:15px}
.dir .tx{flex:1;font-size:14px;line-height:1.4}
.dir.fin .tx{font-weight:800;color:var(--e)}
.dir.start .mi{color:var(--muted)}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{min-width:92px;color:var(--muted);font-weight:600}
.kv .v{flex:1}

/* back */
.backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);
  font-size:15px;font-weight:700;padding:4px 0 12px;cursor:pointer}

/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:8px 9px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
th{background:var(--bg2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
td.name{text-align:left;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:1px}
.dot.E{background:var(--e)}.dot.M{background:var(--m)}.dot.H{background:var(--h)}.dot.VH{background:var(--vh)}
.tclr{background:rgba(255,93,93,.18);color:var(--danger);border:0;width:26px;height:26px;border-radius:7px;
  font-size:12px;font-weight:800;cursor:pointer;line-height:1}
.tclr:active{background:rgba(255,93,93,.32)}

/* checklist */
.chk{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.055);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:.12s;font-size:15px;color:#fff}
.chk.done .box{background:var(--e);border-color:var(--e)}
.chk .lbl{font-size:15px;line-height:1.35}
.chk.done .lbl{color:var(--muted2);text-decoration:line-through}
.chk-req .box{border-color:var(--warn)}
.chk-req.done .box{background:var(--warn);border-color:var(--warn);color:#0b1220}
.reset{background:var(--card);border:1px solid rgba(255,255,255,.1);color:var(--muted);
  border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;margin-top:6px;cursor:pointer}
.progress{font-size:12.5px;color:var(--muted);float:right;font-weight:700}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(15,23,42,.96);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.08);display:flex;
  padding-bottom:var(--safe-bot);height:calc(var(--tabh) + var(--safe-bot))}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:8.5px;font-weight:700;cursor:pointer;padding-top:8px}
nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--accent)}
nav button.nav-home{color:var(--accent)}
nav button.nav-home svg{width:38px;height:38px;padding:8px;box-sizing:border-box;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));stroke:#06131f;margin-top:-10px;
  box-shadow:0 3px 10px rgba(77,163,255,.45)}
.badge-alert{background:var(--danger);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px;position:absolute;transform:translate(14px,-8px)}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--bg2);color:var(--muted);margin:0 5px 5px 0}
.divide{height:1px;background:rgba(255,255,255,.07);margin:16px 0}
.foot{text-align:center;color:var(--muted2);font-size:11.5px;padding:18px 10px 4px;line-height:1.5}
/* clock */
.clock-hero{background:linear-gradient(135deg,#12305a,#131c2e);border:1px solid rgba(77,163,255,.25);
  border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;text-align:center}
.clock-hero .now{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock-hero .elapsed{font-size:13px;color:var(--muted);margin-top:2px}
.clock-hero .status{margin-top:12px;font-size:14px;color:#dce4f4}
.clock-hero .big{font-size:20px;font-weight:800;color:var(--accent);display:block;margin-top:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{display:block;width:100%;max-width:100%;min-width:0;background:var(--bg2);
  border:1px solid rgba(255,255,255,.12);color:var(--text);border-radius:11px;padding:12px 13px;
  font-size:16px;outline:none;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.field input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:48px}
.fuelsel{width:100%;max-width:100%;background:var(--bg2);border:1px solid rgba(255,255,255,.12);color:var(--text);
  border-radius:11px;padding:12px 13px;font-size:16px;-webkit-appearance:none;appearance:none;box-sizing:border-box}
.pace-row{display:flex;gap:8px;align-items:center}
.pace-row input{flex:1 1 auto;min-width:0}
.pace-row .muted{flex:0 0 auto;white-space:nowrap}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;
  padding:14px;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px}
.sched td.legc{text-align:left;font-weight:600}
tr.nowrow td{background:rgba(77,163,255,.16);color:#fff;font-weight:800}
tr.doner td{color:var(--muted2)}
.van-chip{font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;color:#fff;background:var(--accent2)}
.van-chip.v2{background:#8b5cf6}
img.mapimg{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.1);display:block;background:#fff}
img.legmap{width:100%;display:block;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#fff;cursor:zoom-in}
img.mapimg{cursor:zoom-in}
/* hype song */
.song-card{background:linear-gradient(135deg,#173a2c,#15243a);border:1px solid rgba(29,185,84,.35);margin-bottom:12px}
.song-card .song-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8fe3bd;font-weight:800;margin-bottom:6px}
.song-card .song-row{display:flex;align-items:center;gap:13px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
.song-card .song-row:first-of-type{border-top:0}
.song-card .song-body{flex:1;min-width:0}
.song-card .song-title{font-weight:800;font-size:16px}
.song-card .song-artist{font-size:13px;color:var(--muted)}
.song-card .song-play,.set-row .sr-play{background:#1db954;color:#fff;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;text-decoration:none;padding-left:2px}
.song-card .song-play{width:40px;height:40px;border-radius:50%;font-size:15px}
.song-card .song-play:active,.set-row .sr-play:active{opacity:.85}
/* van set list */
.set-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.set-row:last-child{border-bottom:0}
.set-row .sr-body{flex:1;min-width:0}
.set-row .sr-t{font-weight:700;font-size:14px}
.set-row .sr-a{font-size:12.5px;color:var(--muted)}
.set-row .sr-play{width:34px;height:34px;border-radius:50%;font-size:13px}
/* schedule */
.sched-item{display:flex;gap:12px;padding:13px 15px}
.sched-item .st-time{min-width:92px;flex-shrink:0;font-weight:800;font-size:13px;color:var(--accent);line-height:1.35}
.sched-item .st-body{flex:1;min-width:0}
.sched-item .st-title{font-weight:700;font-size:15px}
.sched-item .st-loc{font-size:13px;color:var(--muted);margin-top:2px}
.sched-item .st-note{font-size:12.5px;color:var(--muted2);margin-top:4px;line-height:1.45}
.sched-item .st-note.st-req{color:var(--warn);font-weight:700}
.sched-item.st-key{border:1px solid rgba(77,163,255,.45);background:rgba(77,163,255,.1)}
.sched-item.st-key .st-title{color:var(--accent)}
/* weather hourly */
.wx-hours{border-top:1px solid rgba(255,255,255,.08);max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wx-day{position:sticky;top:0;background:var(--card2);color:var(--muted);font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;padding:6px 16px;z-index:1}
.wx-hr{display:grid;grid-template-columns:42px 24px 1fr 46px 60px;align-items:center;gap:6px;padding:7px 16px;
  font-size:13px;border-bottom:1px solid rgba(255,255,255,.045)}
.wx-hr .wx-t{color:var(--muted);font-variant-numeric:tabular-nums}
.wx-hr .wx-temp{font-weight:700}
.wx-hr .wx-pop{color:var(--accent);font-size:12px;text-align:right}
.wx-hr .wx-wind{color:var(--muted2);font-size:12px;text-align:right;white-space:nowrap}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,10,18,.97);touch-action:none;overscroll-behavior:contain}
.lb-stage{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.lb-img{max-width:100%;max-height:100%;transform-origin:center center;will-change:transform;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;background:#fff;border-radius:4px}
.lb-close{position:absolute;top:calc(var(--safe-top) + 10px);right:14px;z-index:3;background:rgba(255,255,255,.14);
  border:0;color:#fff;font-size:20px;font-weight:700;width:44px;height:44px;border-radius:50%;cursor:pointer;line-height:1}
.lb-close:active{background:rgba(255,255,255,.28)}
.lb-cap{position:absolute;top:calc(var(--safe-top) + 16px);left:16px;z-index:2;color:#fff;font-size:15px;font-weight:700;
  text-shadow:0 1px 4px rgba(0,0,0,.6)}
.lb-hint{position:absolute;bottom:calc(var(--safe-bot) + 16px);left:0;right:0;text-align:center;color:#aab6cf;
  font-size:12px;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.8)}
/* home */
header.clickable{cursor:pointer}
.home-btn-top{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:0;font-size:14px;font-weight:800;padding:10px 15px;border-radius:12px;cursor:pointer;flex-shrink:0}
.home-btn-top svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.home-btn-top:active{opacity:.85}
.home-hero{background:linear-gradient(135deg,#12305a,#1a1233);border:1px solid rgba(77,163,255,.2);
  border-radius:var(--radius);padding:20px 18px;margin-bottom:14px}
.home-hero .hh-title{font-size:22px;font-weight:800}
.home-hero .hero-logo{width:78%;max-width:280px;height:auto;display:block;margin:2px auto 10px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.home-hero .hh-tag{font-size:13px;font-weight:700;color:#e7d9b8;font-style:italic;letter-spacing:.2px}
.home-hero .hh-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.home-btn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid rgba(255,255,255,.07);
  border-radius:15px;padding:15px 14px;cursor:pointer;text-align:left;color:var(--text);transition:.12s}
.home-btn:active{transform:scale(.97);background:var(--card2)}
.home-btn svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.home-btn .t{font-size:15px;font-weight:800}
.home-btn .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.update-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,#1f5a3a,#183a2c);border:1px solid rgba(55,201,138,.4);border-radius:13px;
  padding:12px 14px;margin-bottom:12px;font-size:13.5px;font-weight:700;color:#c9f7e0}
.update-banner button{background:var(--e);color:#06231a;border:0;border-radius:9px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}
.home-ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;margin-right:3px;opacity:.7}
</style>
</head>
<body>
<header id="appHeader">
  <div class="h-row">
    <div style="min-width:0">
      <div class="h-title"><span class="badge">HTC 26</span><span id="h-title-txt">Team Last Milers</span></div>
      <div class="h-sub" id="h-sub">2026 Hood To Coast</div>
    </div>
  </div>
</header>

<main>
  <!-- HOME -->
  <section class="view" id="view-home"></section>

  <!-- LEGS -->
  <section class="view hidden" id="view-legs">
    <div class="searchbar"><input id="legSearch" type="search" inputmode="search" placeholder="Search legs, exchanges, roads…"></div>

/* ---- Actual leg times (runner splits) ---- */
function parseTime(s){
  s=(s||"").trim(); if(!s)return null;
  const parts=s.split(":").map(x=>x.trim());
  if(!parts.length||parts.some(p=>p===""||isNaN(Number(p))))return null;
  let sec;
  if(parts.length===1) sec=parseFloat(parts[0])*60;                          // minutes
  else if(parts.length===2) sec=Number(parts[0])*60+Number(parts[1]);        // MM:SS
  else if(parts.length===3) sec=Number(parts[0])*3600+Number(parts[1])*60+Number(parts[2]); // H:MM:SS
  else return null;
  return sec>0?Math.round(sec):null;
}
function fmtDur2(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`;}
function fmtPaceSec(sec){sec=Math.round(sec);const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,"0")}`;}

let _fb=null,_fbLoading=null;
function ensureFirebase(){
  if(_fb)return Promise.resolve(_fb);
  if(_fbLoading)return _fbLoading;
  _fbLoading=(async()=>{
    const V="https://www.gstatic.com/firebasejs/10.13.2/";
    const appMod=await import(V+"firebase-app.js");
    const fs=await import(V+"firebase-firestore.js");
    const app=appMod.initializeApp(FIREBASE_CONFIG);
    let db;
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}
    catch(e){db=fs.getFirestore(app);}
    const ref=fs.doc(db,"htc","results");
    _fb={fs,db,ref};
    fs.onSnapshot(ref,snap=>{const d=snap.data()||{};TIMES=d.times||{};saveTimesLocal();refreshTimeViews();},err=>{});
    return _fb;
  })();
  return _fbLoading;
}

function runnerName(leg){return LEG_RUNNER[leg]||TEAM[LEGINFO[leg].runner].n;}
function paceMin(p){const [m,s]=String(p).split(":").map(Number);return m+(s||0)/60;}  // "8:45" -> 8.75

const SK={start:"htc26_start",factor:"htc26_pacefactor"};
let clockTimer=null;
const clampF=v=>Math.max(0.8,Math.min(1.2,v));
function factor(){return clampF(parseFloat(localStorage.getItem(SK.factor))||1);}
function startMs(){const s=localStorage.getItem(SK.start);return s?new Date(s).getTime():null;}
function defaultStart(){const d=new Date();d.setHours(7,40,0,0);const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T07:40`;}  // designated team start 7:40 AM
function fmtClock(ms){const d=new Date(ms);let h=d.getHours(),m=d.getMinutes();const ap=h<12?"AM":"PM";h=h%12||12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;}
function fmtDur(min){if(min<0)min=0;const h=Math.floor(min/60),m=Math.round(min%60);return h+"h "+String(m).padStart(2,"0")+"m";}
// each leg is timed by its assigned runner's own pace × the global adjustment factor
function legDurMin(n){const l=LEGS.find(x=>x.n===n);return l.mi*paceMin(runnerOf(n).p)*factor();}
function legStartMin(n){let t=0;for(let i=1;i<n;i++)t+=legDurMin(i);return t;}
function legEndMin(n){return legStartMin(n)+legDurMin(n);}
function totalMin(){return legEndMin(36);}

function clockSetup(){
  return `<div class="note-box">Set your start time to turn on the live race clock, each runner's ETAs, and "who's running now." Paces come from your roster (Prep tab).</div>
    <div class="card">
      <h3>Your team's race plan</h3>
      <div class="field"><label>Start date & time (at Timberline)</label>
        <input type="datetime-local" id="startIn" value="${localStorage.getItem(SK.start)||defaultStart()}"></div>
      <p class="muted small" style="margin:2px 2px 10px">Designated team start: <b>7:40 AM</b> (pre-filled) — change the date if you're testing.</p>
      <button class="btn-primary" id="saveClock">Save & start the clock</button>
      <button class="reset" id="use740" style="width:100%;margin-top:8px">Set to 7:40 AM today</button>
      <p class="muted small" style="margin:10px 2px 0">Projected finish: <b>${fmtDur(totalMin())}</b> after your start — each leg timed by its runner's own pace.</p>
    </div>`;
}
function renderClock(){
  const st=startMs();
  if(!st){views.clock.innerHTML=clockSetup();wireClock();return;}

  const now=Date.now();
  const elapsedMin=(now-st)/60000;
  let statusHtml;
  if(elapsedMin<0){
    statusHtml=`<div class="status">Race starts in<span class="big">${fmtDur(-elapsedMin)}</span>at ${fmtClock(st)}</div>`;
  } else if(elapsedMin>=legEndMin(36)){
    statusHtml=`<div class="status">🏁 Projected finish reached!<span class="big">${fmtClock(st+legEndMin(36)*60000)}</span></div>`;
  } else {
    const cur=LEGS.find(l=>elapsedMin>=legStartMin(l.n)&&elapsedMin<legEndMin(l.n));
    const li=LEGINFO[cur.n], r=runnerOf(cur.n);
    const toNext=legEndMin(cur.n)-elapsedMin;
    statusHtml=`<div class="status">Now running · <span class="van-chip ${li.van===2?'v2':''}">Van ${li.van}</span>
      <span class="big">${esc(runnerName(cur.n))} · Leg ${cur.n} <span class="pill ${cur.d}" style="font-size:11px;vertical-align:middle">${cur.d}</span></span>
      Next exchange (${cur.n===36?"Finish":"Exch "+cur.n}) in ~${fmtDur(toNext)} · ETA ${fmtClock(st+legEndMin(cur.n)*60000)}</div>`;
  }
  const rows=LEGS.map(l=>{
    const li=LEGINFO[l.n], r=runnerOf(l.n), eta=st+legEndMin(l.n)*60000;
    const isNow=elapsedMin>=legStartMin(l.n)&&elapsedMin<legEndMin(l.n);
    const done=elapsedMin>=legEndMin(l.n);
    return `<tr class="${isNow?'nowrow':''} ${done?'doner':''}">
      <td><span class="van-chip ${li.van===2?'v2':''}">V${li.van}</span></td>
      <td class="legc">Leg ${l.n} · ${esc(runnerName(l.n))}</td>
      <td>${l.mi}</td>
      <td>${fmtClock(st+legStartMin(l.n)*60000)}</td>
      <td>${fmtClock(eta)}</td></tr>`;
  }).join("");
  views.clock.innerHTML=`
    <div class="clock-hero">
      <div class="now" id="liveNow">${fmtClock(now)}</div>
      <div class="elapsed">${elapsedMin>=0?"Elapsed "+fmtDur(elapsedMin)+" · started "+fmtClock(st):"Starts "+fmtClock(st)}</div>
      ${statusHtml}
    </div>
    <div class="card" style="display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:12px">
      <div style="flex:1"><b>Pace</b> <span class="muted small">${Math.round(factor()*100)}% of roster · finish ${fmtClock(st+totalMin()*60000)}</span></div>
      <button class="reset" id="pDown" style="margin:0;width:50px">−5%</button>
      <button class="reset" id="pUp" style="margin:0;width:50px">+5%</button>
    </div>
    <h2 class="sec">Projected schedule <span class="progress">tap Clock to refresh</span></h2>
    <div class="tbl-wrap"><table class="sched">
      <thead><tr><th>Van</th><th>Leg · Runner</th><th>Mi</th><th>Start</th><th>Exch by</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="reset" id="editClock" style="flex:1;margin:0">⚙ Change start time</button>
      <button class="reset" id="resetClock" style="flex:1;margin:0">↺ Reset clock</button>
    </div>`;
  const bump=d=>{localStorage.setItem(SK.factor,clampF(factor()+d).toFixed(2));renderClock();};
  $("#pDown").onclick=()=>bump(-0.05); $("#pUp").onclick=()=>bump(0.05);
  $("#editClock").onclick=()=>{views.clock.innerHTML=clockSetup();wireClock();};
  $("#resetClock").onclick=()=>{localStorage.removeItem(SK.start);localStorage.removeItem(SK.factor);renderClock();};
  clearInterval(clockTimer);
  clockTimer=setInterval(()=>{const el=$("#liveNow");if(el&&curTab==="clock"){el.textContent=fmtClock(Date.now());}else{clearInterval(clockTimer);}},1000);
}
function wireClock(){
  const sv=$("#saveClock");if(!sv)return;
  const u=$("#use740"); if(u)u.onclick=()=>{const el=$("#startIn");if(el)el.value=defaultStart();};
  sv.onclick=()=>{
    const s=$("#startIn").value;
    if(!s){$("#startIn").focus();return;}
    localStorage.setItem(SK.start,s);
    if(!localStorage.getItem(SK.factor))localStorage.setItem(SK.factor,"1");
    renderClock();
  };
}

const WX=[
  {n:"Start · Mt. Hood",la:45.3048,lo:-121.7592},
  {n:"Sandy · Exch 6",la:45.4057,lo:-122.2769},
  {n:"Portland · Exch 12",la:45.5067,lo:-122.6643},

  {n:"Astoria · Exch 30",la:46.0658,lo:-123.6927},
  {n:"Finish · Seaside",la:45.9938,lo:-123.9301}
];
function wxCode(c){
  const m={0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
    45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],
    61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],
    71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["🌨️","Snow grains"],
    80:["🌦️","Showers"],81:["🌧️","Showers"],82:["⛈️","Heavy showers"],85:["🌨️","Snow showers"],86:["❄️","Snow showers"],
    95:["⛈️","Thunderstorm"],96:["⛈️","Storm w/ hail"],99:["⛈️","Severe storm"]};
  return m[c]||["🌡️","—"];
}
function wxHourly(d){
  if(!d.hourly||!d.hourly.length) return '<div class="muted small" style="padding:10px 16px">No hourly data — refresh with signal.</div>';
  let html="", curDay="";
  d.hourly.forEach(h=>{
    const dt=h.t.split("T")[0], tm=h.t.split("T")[1]; const p=dt.split("-").map(Number);
    const dayName=new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    if(dayName!==curDay){curDay=dayName; html+=`<div class="wx-day">${dayName}</div>`;}
    const hh=+tm.slice(0,2), ap=hh<12?"a":"p", h12=hh%12||12, ic=wxCode(h.code);
    const pop=(h.pop!=null&&h.pop>0)?`<span class="wx-pop">${h.pop}%</span>`:"<span></span>";
    html+=`<div class="wx-hr"><span class="wx-t">${h12}${ap}</span><span>${ic[0]}</span><span class="wx-temp">${h.temp}°</span>${pop}<span class="wx-wind">${h.wind} mph</span></div>`;
  });
  return html;
}
function wxToggle(i){const el=$("#wxh-"+i), a=$("#wxa-"+i);if(el){el.classList.toggle("hidden");if(a)a.textContent=el.classList.contains("hidden")?"▾":"▴";}}
function wxLayout(payload,status){
  let cards="";
  if(payload&&payload.data){
    cards=payload.data.map((d,i)=>{const ic=wxCode(d.code); const has=d.hourly&&d.hourly.length;
      return `<div class="card wx-card" style="padding:0;overflow:hidden">
        <div class="wx-head" ${has?`onclick="wxToggle(${i})"`:""} style="display:flex;align-items:center;gap:14px;padding:14px 16px;${has?'cursor:pointer':''}">
          <div style="font-size:34px;line-height:1">${ic[0]}</div>
          <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:15px">${esc(d.name)}</div>
            <div class="muted small">${ic[1]} · ${d.wind} mph${has?` · 48-hr <span id="wxa-${i}">▾</span>`:""}</div></div>
          <div style="text-align:right"><div style="font-size:22px;font-weight:800">${d.temp}°</div>
            <div class="muted small">H ${d.hi}° · L ${d.lo}°</div></div></div>
        ${has?`<div class="wx-hours hidden" id="wxh-${i}">${wxHourly(d)}</div>`:""}
      </div>`;
    }).join("");
  }
  const when=payload&&payload.ts?"Updated "+fmtClock(payload.ts):"";
  return `<div class="note-box">Live forecast for key points along the course. Tap a location for its 48-hour hourly forecast. Refreshes when you have signal; otherwise shows the last saved.</div>
    <div style="display:flex;align-items:center;gap:10px;margin:0 4px 12px">
      <div class="muted small" style="flex:1">${status||when}</div>
      <button class="reset" id="wxRefresh" style="margin:0">↻ Refresh</button>
    </div>
    ${cards||'<div class="card"><p class="muted" style="margin:0">No saved forecast yet. Connect to Wi-Fi/data and tap Refresh.</p></div>'}
    <p class="muted small" style="text-align:center;margin-top:10px">Weather by Open-Meteo</p>`;
}
function wireWx(){const rf=$("#wxRefresh");if(rf)rf.onclick=()=>{if(navigator.onLine)loadWeather();else{const c=JSON.parse(localStorage.getItem("htc26_wx")||"null");views.weather.innerHTML=wxLayout(c,"No signal — still offline");wireWx();}};}
function renderWeather(){
  const cached=JSON.parse(localStorage.getItem("htc26_wx")||"null");
  views.weather.innerHTML=wxLayout(cached, navigator.onLine?"Updating…":(cached?"Offline — last saved shown":"Offline — no saved forecast"));
  wireWx();
  if(navigator.onLine) loadWeather();
}
async function loadWeather(){
  try{
    const lat=WX.map(p=>p.la).join(","), lon=WX.map(p=>p.lo).join(",");
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=3`;
    const res=await fetch(url,{cache:"no-store"}); const j=await res.json();
    const arr=Array.isArray(j)?j:[j];
    const now=Date.now();
    const data=arr.map((loc,i)=>{
      const hourly=[]; const H=loc.hourly;
      if(H&&H.time){
        let i0=H.time.findIndex(t=>new Date(t).getTime()>=now); if(i0<0)i0=0;
        for(let k=i0;k<Math.min(H.time.length,i0+48);k++){
          hourly.push({t:H.time[k],temp:Math.round(H.temperature_2m[k]),code:H.weather_code[k],
            pop:(H.precipitation_probability?H.precipitation_probability[k]:null),wind:Math.round(H.wind_speed_10m[k])});
        }
      }
      return {name:WX[i].n,temp:Math.round(loc.current.temperature_2m),code:loc.current.weather_code,
        wind:Math.round(loc.current.wind_speed_10m),hi:Math.round(loc.daily.temperature_2m_max[0]),lo:Math.round(loc.daily.temperature_2m_min[0]),hourly};
    });
    const payload={ts:Date.now(),data};
    localStorage.setItem("htc26_wx",JSON.stringify(payload));
    if(curTab==="weather"){views.weather.innerHTML=wxLayout(payload,"");wireWx();}
  }catch(e){
    if(curTab==="weather"){const c=JSON.parse(localStorage.getItem("htc26_wx")||"null");
      views.weather.innerHTML=wxLayout(c,c?"Couldn’t refresh — showing last saved":"Couldn’t load — check signal");wireWx();}
  }
}

/* ---- Results & analytics (from logged leg times) ---- */
function deltaStr(sec){const a=fmtPaceSec(Math.abs(sec));return sec<0?`${a} faster`:(sec>0?`${a} slower`:"on pace");}
function renderResults(){
  const L=[];
  LEGS.forEach(l=>{const t=legTime(l.n); if(t!=null){const r=LEGINFO[l.n].runner;
    L.push({n:l.n,mi:l.mi,sec:t,runner:r,name:runnerName(l.n),van:LEGINFO[l.n].van,pace:t/l.mi,projPace:paceMin(TEAM[r].p)*60});}});
  if(!L.length){views.results.innerHTML=`<div class="note-box">📊 No leg times logged yet. As runners finish, tap their leg and enter the time under <b>⏱ Your time</b> — it's <b>shared live</b> with the whole team, so results and analytics show up here for everyone.</div>`;return;}
  const totSec=L.reduce((a,b)=>a+b.sec,0), totMi=L.reduce((a,b)=>a+b.mi,0);
  const projSec=L.reduce((a,b)=>a+b.projPace*b.mi,0);
  const overall=totSec/totMi, delta=totSec-projSec;
  const fast=[...L].sort((a,b)=>a.pace-b.pace)[0];
  const slow=[...L].sort((a,b)=>b.pace-a.pace)[0];
  const best=[...L].sort((a,b)=>(a.pace-a.projPace)-(b.pace-b.projPace))[0];
  const complete=L.length===36;
  const stat=(v,l)=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  // per runner
  const runners=[...new Set(L.map(x=>x.runner))].sort((a,b)=>a-b);
  const rrows=runners.map(r=>{const ls=L.filter(x=>x.runner===r);const s=ls.reduce((a,b)=>a+b.sec,0),mi=ls.reduce((a,b)=>a+b.mi,0);
    return `<tr><td><span class="van-chip ${ls[0].van===2?'v2':''}">V${ls[0].van}</span></td>
      <td class="name" style="text-align:left">${esc(TEAM[r].n)}</td><td>${ls.length}/3</td>
      <td>${fmtDur2(s)}</td><td>${fmtPaceSec(s/mi)}</td></tr>`;}).join("");
  const lrows=[...L].sort((a,b)=>a.n-b.n).map(x=>{const d=x.pace-x.projPace;
    return `<tr><td>${x.n}</td><td class="name" style="text-align:left">${esc(x.name)}</td><td>${fmtDur2(x.sec)}</td>
      <td>${fmtPaceSec(x.pace)}</td><td style="color:${d<0?'var(--e)':(d>0?'var(--h)':'var(--muted)')}">${d<0?'−':(d>0?'+':'')}${fmtPaceSec(Math.abs(d))}</td>
      <td><button class="tclr" title="Clear this time" onclick="clearResult(${x.n})">✕</button></td></tr>`;}).join("");
  views.results.innerHTML=`
   <div class="note-box">📊 Live team results — shared across everyone (${L.length}/36 legs logged).${complete?'':' Anyone can log a leg time on its screen and it appears here for all.'}</div>
   <div class="detail-head">
     <div class="stats" style="margin-top:0">
       ${stat(complete?'🏁 '+fmtDur2(totSec):fmtDur2(totSec), complete?'Team finish':'Time logged')}
       ${stat(fmtPaceSec(overall),'Overall /mi')}
       ${stat(totMi.toFixed(1),'Miles')}
     </div>
     <div class="status" style="margin-top:12px;text-align:center">vs. roster projection: <b style="color:${delta<0?'var(--e)':'var(--h)'}">${deltaStr(delta)}</b></div>
   </div>
   <h2 class="sec">Highlights</h2>
   <div class="card">
     <div class="kv"><div class="k">⚡ Fastest leg</div><div class="v">Leg ${fast.n} · ${esc(fast.name)} — ${fmtPaceSec(fast.pace)}/mi</div></div>
     <div class="kv"><div class="k">🐢 Slowest leg</div><div class="v">Leg ${slow.n} · ${esc(slow.name)} — ${fmtPaceSec(slow.pace)}/mi</div></div>
     <div class="kv"><div class="k">🎯 Beat pace by most</div><div class="v">Leg ${best.n} · ${esc(best.name)} — ${deltaStr(Math.round((best.pace-best.projPace)*best.mi))} on the leg</div></div>
   </div>
   <h2 class="sec">By runner</h2>
   <div class="tbl-wrap"><table><thead><tr><th>Van</th><th>Runner</th><th>Legs</th><th>Total</th><th>Avg /mi</th></tr></thead><tbody>${rrows}</tbody></table></div>
   <h2 class="sec">By leg</h2>
   <div class="tbl-wrap"><table><thead><tr><th>Leg</th><th>Runner</th><th>Time</th><th>Pace</th><th>vs proj</th><th></th></tr></thead><tbody>${lrows}</tbody></table></div>
   <p class="muted small" style="text-align:center;margin-top:8px">“vs proj” compares actual pace to each runner's roster pace (− = faster).</p>`;
}

/* ---- Updates (auto when online, silent local fallback) ---- */
let _updateReady=false, _manualReload=false;
function updStatus(m){const e=$("#updStatus");if(e)e.textContent=m;}
function renderUpdateSlot(){
  const slot=$("#updateSlot");if(!slot)return;
  slot.innerHTML=_updateReady?`<div class="update-banner"><span>✨ A new version is ready.</span><button id="reloadNow">Update now</button></div>`:"";
  const r=$("#reloadNow");if(r)r.onclick=doReload;
}
function doReload(){
  _manualReload=true;
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(reg&&reg.waiting){reg.waiting.postMessage("skipWaiting");}else{location.reload();}
  });
}
async function checkForUpdate(manual){
  if(!("serviceWorker" in navigator)){if(manual)updStatus("Updates aren’t supported in this browser.");return;}
  if(!navigator.onLine){if(manual)updStatus("No signal — you’re using your saved copy. ✓");return;}
  const reg=await navigator.serviceWorker.getRegistration();
  if(!reg){if(manual)updStatus("Open once more to finish setup, then updates will work.");return;}
  if(manual)updStatus("Checking GitHub…");
  try{
    await reg.update();
    await new Promise(r=>setTimeout(r,1600));
    if(reg.waiting){_updateReady=true;renderUpdateSlot();if(manual){updStatus("Update found — applying…");doReload();}}
    else if(reg.installing){
      if(manual)updStatus("Downloading update…");
      reg.installing.addEventListener("statechange",function(){
        if(this.state==="installed"){_updateReady=true;renderUpdateSlot();if(manual){updStatus("Update found — applying…");doReload();}}
      });
    } else {if(manual)updStatus("You’re on the latest version. ✓");}
  }catch(e){if(manual)updStatus("Couldn’t reach GitHub — using your saved copy. ✓");}
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(_manualReload){_manualReload=false;location.reload();}});
}

/* ---- Image lightbox (offline pinch/pan zoom) ---- */
(function(){
  const lb=$("#lightbox"), stage=$("#lbStage"), img=$("#lbImg"), cap=$("#lbCap");
  let scale=1,tx=0,ty=0;
  const pts=new Map(); let lastDist=0,lastMid=null,lastPan=null,moved=false,lastTap=0,lastTapXY=null;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function apply(){img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
  function reset(){scale=1;tx=0;ty=0;apply();}
  function center(){const r=stage.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
  window.openLightbox=function(src,caption){
    img.src=src; img.alt=caption||""; cap.textContent=caption||"";
    reset(); lb.classList.remove("hidden"); lb.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
  };
  function close(){lb.classList.add("hidden");lb.setAttribute("aria-hidden","true");document.body.style.overflow="";img.src="";}
  $("#lbClose").onclick=close;
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!lb.classList.contains("hidden"))close();});
  function zoomAround(qx,qy,s2){
    const c=center(), fx=qx-c.x, fy=qy-c.y;
    tx=fx-(fx-tx)*(s2/scale); ty=fy-(fy-ty)*(s2/scale); scale=s2; apply();
  }
  stage.addEventListener("pointerdown",e=>{
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
    if(pts.size===1){lastPan={x:e.clientX,y:e.clientY};}
    if(pts.size===2){lastDist=0;lastMid=null;}
  });
  stage.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[...pts.values()];
    if(a.length>=2){
      e.preventDefault(); moved=true;
      const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
      if(lastDist&&lastMid){
        tx+=mid.x-lastMid.x; ty+=mid.y-lastMid.y;
        zoomAround(mid.x,mid.y,clamp(scale*(dist/lastDist),1,6));
      }
      lastDist=dist; lastMid=mid;
    } else if(a.length===1&&scale>1&&lastPan){
      e.preventDefault(); moved=true;
      tx+=e.clientX-lastPan.x; ty+=e.clientY-lastPan.y; lastPan={x:e.clientX,y:e.clientY}; apply();
    }
  });
  function endPtr(e){
    pts.delete(e.pointerId);
    if(pts.size===1){const p=[...pts.values()][0];lastPan={x:p.x,y:p.y};lastDist=0;lastMid=null;}
    if(pts.size===0){
      if(scale<=1.02){reset();}
      if(!moved){ // tap
        const now=Date.now();
        if(now-lastTap<300&&lastTapXY&&Math.hypot(e.clientX-lastTapXY.x,e.clientY-lastTapXY.y)<40){
          if(scale>1.02)reset(); else zoomAround(e.clientX,e.clientY,2.6);
          lastTap=0;
        } else {
          lastTap=now; lastTapXY={x:e.clientX,y:e.clientY};
          // single tap on backdrop (image not filling) closes when not zoomed
          if(scale<=1.02&&e.target!==img)close();
        }
      }
    }
  }
  stage.addEventListener("pointerup",endPtr);
  stage.addEventListener("pointercancel",e=>{pts.delete(e.pointerId);});
  stage.addEventListener("wheel",e=>{e.preventDefault();zoomAround(e.clientX,e.clientY,clamp(scale*(e.deltaY<0?1.15:0.87),1,6));if(scale<=1.02)reset();},{passive:false});
})();
